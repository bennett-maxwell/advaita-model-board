<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Advaita model board</title>
<style>
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}
button{cursor:pointer;font:inherit}
:root {
  --bg: #f4f4f2;
  --ink: #1c1917;
  --muted: #57534e;
  --line: #e4e1db;
  --soft: #eceae4;
  --amber: #d97706;
  --bar-edge: #1c1917;
  --sheet: #fffcf7;
  --hatch: rgba(28, 25, 23, 0.14);
  --good: #16a34a;
}

:root[data-theme="dark"] {
  --bg: #141311;
  --ink: #f5f1ea;
  --muted: #a8a29e;
  --line: #2c2926;
  --soft: #1e1c19;
  --amber: #f59e0b;
  --bar-edge: #f5f1ea;
  --sheet: #1c1a17;
  --hatch: rgba(245, 241, 234, 0.18);
  --good: #4ade80;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311;
    --ink: #f5f1ea;
    --muted: #a8a29e;
    --line: #2c2926;
    --soft: #1e1c19;
    --amber: #f59e0b;
    --bar-edge: #f5f1ea;
    --sheet: #1c1a17;
    --hatch: rgba(245, 241, 234, 0.18);
    --good: #4ade80;
  }
}

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px 48px;
}

.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.word {
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}

.brand {
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--muted);
  margin: 0;
}

.brand span {
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 650;
  color: var(--ink);
}

.meta,
.draft {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.lede strong {
  font-weight: 650;
  color: var(--ink);
}

.legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 12px;
  margin: 16px 0 0;
  padding: 0;
  list-style: none;
}

.legend li {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 28px;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.2;
}

.key {
  position: relative;
  width: 28px;
  height: 10px;
  border-radius: 6px;
  flex: 0 0 auto;
}

.key-new {
  background: var(--ink);
}

.key-old {
  background: var(--soft);
}

.key-old::after {
  content: "";
  position: absolute;
  left: 13px;
  top: -5px;
  height: 20px;
  border-left: 1.5px dashed var(--ink);
}

.key-fight {
  background: repeating-linear-gradient(
    -45deg,
    var(--amber),
    var(--amber) 3px,
    transparent 3px,
    transparent 6px
  );
  box-shadow: inset 0 0 0 1px var(--amber);
}

.key-none {
  background: repeating-linear-gradient(
    -45deg,
    var(--hatch),
    var(--hatch) 3px,
    transparent 3px,
    transparent 6px
  );
}

h1 {
  font-size: 28px;
  line-height: 1.15;
  font-weight: 700;
  margin: 4px 0 0;
  text-align: left;
}

.lede {
  margin: 12px 0 0;
  font-size: 16px;
  text-align: left;
}

.ghost {
  min-height: 44px;
  min-width: 44px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  white-space: nowrap;
  flex: 0 0 auto;
}

.tabs {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 16px;
  margin: 8px -16px 0;
  background: var(--bg);
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  white-space: nowrap;
}

.tab[aria-selected="true"] {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

.section {
  margin-top: 32px;
}

.kicker {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.card-title {
  margin: 4px 0 0;
  font-size: 22px;
  line-height: 1.2;
  font-weight: 700;
  text-align: left;
}

.used {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 16px;
}

.best {
  margin: 10px 0 12px;
  font-size: 16px;
  font-weight: 650;
}

.row {
  display: grid;
  grid-template-columns: 86px 1fr 100px;
  gap: 8px;
  align-items: center;
  min-height: 56px;
  width: 100%;
  padding: 4px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
}

.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
}

.tag {
  font-size: 13px;
  font-weight: 650;
  line-height: 1.2;
}

.track {
  position: relative;
  height: 36px;
}

.bar,
.band,
.stub,
.nub {
  position: absolute;
  top: 13px;
  height: 10px;
  border-radius: 6px;
}

.bar,
.nub {
  left: 0;
}

.bar.edge,
.nub.edge {
  box-shadow: inset 0 0 0 1px var(--bar-edge);
}

.band {
  background: repeating-linear-gradient(
    -45deg,
    var(--amber),
    var(--amber) 3px,
    transparent 3px,
    transparent 6px
  );
  box-shadow: inset 0 0 0 1px var(--amber);
}

.stub {
  width: 18%;
  background: repeating-linear-gradient(
    -45deg,
    var(--hatch),
    var(--hatch) 3px,
    transparent 3px,
    transparent 6px
  );
}

.nub {
  width: 3px;
}

.tick {
  position: absolute;
  width: 0;
  border-left: 1.5px dashed var(--ink);
  pointer-events: none;
}

.tick.top {
  top: 2px;
  height: 12px;
}

.tick.bot {
  top: 22px;
  height: 12px;
}

.tick span {
  position: absolute;
  left: 3px;
  font-size: 11px;
  line-height: 1;
  color: var(--muted);
  white-space: nowrap;
}

.tick.top span {
  top: 0;
}

.tick.bot span {
  bottom: 0;
}

.tick.right span {
  left: auto;
  right: 3px;
}

.score {
  font-size: 17px;
  font-weight: 700;
  text-align: right;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
}

.score small {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
}

.score.bad {
  color: var(--amber);
}

.flag {
  display: block;
  font-size: 11px;
  color: var(--amber);
  font-weight: 600;
}

.steps {
  margin: 16px 0 0;
  padding: 0;
  list-style: none;
}

.steps li {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.steps strong {
  display: block;
  margin-bottom: 4px;
}

.jobs {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}

.job,
.send {
  min-height: 44px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  text-align: left;
  padding: 10px 12px;
}

.job[aria-pressed="true"] {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

.other {
  min-height: 44px;
  width: 100%;
  box-sizing: border-box;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--sheet);
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  padding: 10px 12px;
}

.rec {
  margin: 12px 0 0;
}

.src-block {
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}

.src-block h3,
.sheet h3 {
  margin: 16px 0 6px;
  font-size: 16px;
  text-align: left;
}

.src-block p,
.foot p,
.sheet p {
  margin: 0 0 8px;
}

.sheet-back {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: 20;
  border: 0;
  padding: 0;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 21;
  max-height: 78vh;
  overflow: auto;
  background: var(--sheet);
  color: var(--ink);
  border-radius: 16px 16px 0 0;
  padding: 12px 16px 28px;
}

.sheet h2 {
  margin: 8px 0 0;
  font-size: 22px;
  text-align: left;
}

.sheet a {
  color: inherit;
  font-weight: 650;
}

.src-link {
  display: block;
  min-height: 44px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}

.foot {
  margin-top: 36px;
  color: var(--muted);
  font-size: 13px;
}

</style>
</head>

<script>const D = JSON.parse(document.getElementById("visual-data").textContent);
const TABS = [
  ["pick", "Pick"],
  ["cost", "Cost"],
  ["speed", "Speed"],
  ["value", "Value"],
  ["boss", "Boss"],
  ["hands", "Hands"],
  ["sources", "Sources"],
];

function modelById(id) {
  return D.models.find((m) => m.id === id);
}
function metricById(id) {
  return D.metrics.find((m) => m.id === id);
}
function scaleMax(id) {
  let max = 0;
  for (const m of D.models) {
    const c = D.cells[id][m.id];
    if (c && c.lo != null) max = Math.max(max, c.lo, c.hi == null ? c.lo : c.hi);
    for (const t of (D.ticks[id] && D.ticks[id][m.id]) || []) max = Math.max(max, t.value);
  }
  return max || 1;
}
function ranked(id) {
  const metric = metricById(id);
  const rows = D.models.map((model) => ({ model, cell: D.cells[id][model.id] }));
  rows.sort((a, b) => {
    const av = a.cell.lo;
    const bv = b.cell.lo;
    if (av == null && bv == null) return a.model.tag.localeCompare(b.model.tag);
    if (av == null) return 1;
    if (bv == null) return -1;
    const as = metric.higher ? av : a.cell.hi == null ? av : a.cell.hi;
    const bs = metric.higher ? bv : b.cell.hi == null ? bv : b.cell.hi;
    if (as === bs) return a.model.tag.localeCompare(b.model.tag);
    return metric.higher ? bs - as : as - bs;
  });
  return rows;
}
function bestLive(id) {
  const live = ranked(id).filter((r) => r.model.bestLive && r.cell.lo != null);
  if (!live.length) return { kind: "none" };
  const top = live[0];
  if (top.cell.hi != null) return { kind: "range", model: top.model, cell: top.cell };
  return { kind: "one", model: top.model, cell: top.cell };
}
function headline(id) {
  const metric = metricById(id);
  const b = bestLive(id);
  const dir = metric.higher ? "Higher is better." : "Lower is better.";
  if (b.kind === "none") return "No live model has a published number. " + dir;
  if (b.kind === "range") return "Sources disagree on " + b.model.tag + ": " + b.cell.text + ". " + dir;
  return "Best live: " + b.model.tag + " " + b.cell.text + ". " + dir;
}
function lineFor(id, fallback) {
  const b = bestLive(id);
  if (b.kind === "none") return fallback;
  if (b.kind === "range") return b.model.tag + " " + b.cell.text + ", and the sources disagree";
  return b.model.tag + " at " + b.cell.text;
}
function placeTicks(list, max) {
  const top = [];
  const bot = [];
  return list.map((tick) => {
    const p = tick.value / max;
    const hit = (arr) => arr.some((q) => Math.abs(q - p) < 0.22);
    if (!hit(top)) {
      top.push(p);
      return { tick, slot: "top", p };
    }
    if (!hit(bot)) {
      bot.push(p);
      return { tick, slot: "bot", p };
    }
    return { tick, slot: "hide", p };
  });
}
function mark(model) {
  const c = model.ink;
  if (model.mark === "a")
    return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 L14.5 14.5 H11.4 L10.2 11.2 H5.8 L4.6 14.5 H1.5 Z M6.6 9 H9.4 L8 5.2 Z" fill="' + c + '"/></svg>';
  if (model.mark === "hex")
    return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2 L13.6 4.4 V11.6 L8 14.8 L2.4 11.6 V4.4 Z" fill="' + c + '"/></svg>';
  if (model.mark === "star")
    return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 L9.5 6.2 H15 L10.6 9.4 L12.2 14.6 L8 11.4 L3.8 14.6 L5.4 9.4 L1 6.2 H6.5 Z" fill="' + c + '"/></svg>';
  if (model.mark === "inf")
    return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 5.2 A2.3 2.3 0 1 0 4.2 10.8 L11.8 5.2 A2.3 2.3 0 1 1 11.8 10.8 Z" fill="none" stroke="' + c + '" stroke-width="1.6"/></svg>';
  if (model.mark === "x")
    return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3 L7 8 L3 13 H5.4 L8 9.6 L10.6 13 H13 L9 8 L13 3 H10.6 L8 6.4 L5.4 3 Z" fill="' + c + '"/></svg>';
  return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="' + c + '"/></svg>';
}
function flag(id) {
  if (id === "argon") return "Waitlist";
  if (id === "grokf") return "Build only";
  if (id === "q27") return "Studio";
  return "";
}
function rowHtml(metric, model) {
  const cell = D.cells[metric.id][model.id];
  const max = scaleMax(metric.id);
  const placed = placeTicks((D.ticks[metric.id] && D.ticks[metric.id][model.id]) || [], max);
  const lo = cell.lo;
  const hi = cell.hi;
  const edge = model.edge ? " edge" : "";
  let track = "";
  if (lo == null) track += '<span class="stub"></span>';
  else if (hi == null && lo > 0)
    track += '<span class="bar' + edge + '" style="width:' + (lo / max) * 100 + "%;background:" + model.hex + '"></span>';
  else if (lo === 0 && hi == null)
    track += '<span class="nub' + edge + '" style="background:' + model.hex + '"></span>';
  else if (hi != null)
    track +=
      '<span class="band" style="left:' +
      (lo / max) * 100 +
      "%;width:" +
      Math.max(2, ((hi - lo) / max) * 100) +
      '%"></span>';
  for (const item of placed) {
    if (item.slot === "hide") continue;
    const right = item.p > 0.72 ? " right" : "";
    track +=
      '<span class="tick ' +
      item.slot +
      right +
      '" style="left:' +
      item.p * 100 +
      '%"><span>' +
      item.tick.ver +
      "</span></span>";
  }
  const f = flag(model.id);
  return (
    '<button type="button" class="row" data-open="' +
    metric.id +
    ":" +
    model.id +
    '"><span class="chip"><span class="' +
    (model.edge ? "edge" : "") +
    '" style="width:22px;height:22px;border-radius:6px;background:' +
    model.hex +
    ";display:grid;place-items:center;flex:0 0 auto;" +
    (model.edge ? "box-shadow:inset 0 0 0 1px var(--bar-edge)" : "") +
    '">' +
    mark(model) +
    '</span><span class="tag">' +
    model.tag +
    (f ? '<span class="flag">' + f + "</span>" : "") +
    '</span></span><span class="track">' +
    track +
    '</span><span class="score' +
    (hi != null ? " bad" : "") +
    '">' +
    cell.text +
    (hi != null ? "<small>disagree</small>" : "") +
    "</span></button>"
  );
}
function chart(metric) {
  const rows = ranked(metric.id)
    .map((r) => rowHtml(metric, r.model))
    .join("");
  return (
    '<section class="section"><p class="kicker">' +
    metric.kicker +
    '</p><h2 class="card-title">' +
    metric.title +
    '</h2><p class="best">' +
    headline(metric.id) +
    '</p><p class="used">Bench: ' +
    metric.bench +
    ". Used for: " +
    metric.used +
    ".</p>" +
    rows +
    "</section>"
  );
}

const root = document.querySelector("main");
let tab = "pick";
let dark = false;
let job = null;
let open = null;

function sheet() {
  if (!open) return "";
  const metric = metricById(open[0]);
  const model = modelById(open[1]);
  const cell = D.cells[metric.id][model.id];
  const older = (D.ticks[metric.id] && D.ticks[metric.id][model.id]) || [];
  const price = D.prices[model.id];
  const links = cell.sources.length
    ? cell.sources
        .map(
          (src) =>
            '<a class="src-link" href="' +
            src.url +
            '" target="_blank" rel="noreferrer">' +
            src.who +
            ". " +
            src.detail +
            "</a>",
        )
        .join("")
    : "<p>No source, because no public number was found.</p>";
  const old = older.length
    ? "<ul class='steps'>" + older.map((t) => "<li>" + t.ver + ": " + t.value + ". " + t.detail + "</li>").join("") + "</ul>"
    : "<p>No older version in the last 6 months had a published number on this bench.</p>";
  const priceLine = price
    ? "<p>$" + price.inn + " in / $" + price.out + " out per 1M tokens. " + price.note + "</p>"
    : "<p>No public price on this pull.</p>";
  return (
    '<button type="button" class="sheet-back" data-close="1" aria-label="Close details"></button><aside class="sheet" role="dialog"><button type="button" class="ghost" data-close="1">Close</button><h2>' +
    model.name +
    '</h2><p class="used">' +
    metric.title +
    "</p>" +
    (model.access ? "<p>" + model.access + "</p>" : "") +
    "<p>" +
    cell.text +
    (cell.lo == null ? "" : " " + metric.unit) +
    (cell.hi != null ? " Sources disagree. Not averaged." : "") +
    "</p>" +
    (cell.note ? "<p>" + cell.note + "</p>" : "") +
    links +
    "<h3>Older versions</h3>" +
    old +
    "<h3>Price</h3>" +
    priceLine +
    "<p>Pulled " +
    D.pulled +
    ".</p></aside>"
  );
}

function body() {
  const house = D.house.inputTokens.toLocaleString("en-US");
  const out = D.house.outputTokens.toLocaleString("en-US");
  const active = D.jobs.find((j) => j.id === job);
  let view = "";
  if (tab === "pick") {
    view =
      '<section class="section"><p class="kicker">How to choose</p><h2 class="card-title">Four steps, then a bench</h2><ol class="steps"><li><strong>1. Name the job</strong> A boss plans and checks other agents. Hands on a computer clicks a desktop. A repo worker writes code in a terminal. Short turns are the cheap path.</li><li><strong>2. Cross off what you cannot run</strong> Argon is waitlist only. Grok Fast only runs inside Cursor and Grok Build. Q27B only runs on your Studio. Those three can still show a score. They cannot be the best live pick.</li><li><strong>3. Read the three scores</strong> Cost is dollars for one house turn (' +
      house +
      " in, " +
      out +
      " out). Speed is seconds to write those " +
      out +
      ' tokens. Value is AA points per dollar, and it stays blank if either input is missing or the sources fight.</li><li><strong>4. Take the top of the matching bench</strong> Do not average Terminal-Bench with DeepSWE, and do not average two prices into one score. A dashed tick is an older version. A tick past the bar means that older version scored higher.</li></ol><h2 class="card-title" style="margin-top:24px">What are you staffing?</h2><div class="jobs">' +
      D.jobs
        .map(
          (item) =>
            '<button type="button" class="job" data-job="' +
            item.id +
            '" aria-pressed="' +
            (job === item.id) +
            '">' +
            item.label +
            "</button>",
        )
        .join("") +
      '<input class="other" id="other" placeholder="Other" aria-label="Other job"></div>' +
      (active ? '<p class="rec">' + active.blurb + "</p>" : "") +
      (job && !active ? '<p class="rec">Saved. Use Cost, Speed, and Value, then the bench closest to that job.</p>' : "") +
      '<p class="used">Terra on this board is GPT-5.6 Terra. GPT-6 Terra is not out. Muse on this board is Muse Spark 1.3, not Muse Wonder.</p></section>';
  }
  view += D.metrics
    .filter((m) => m.tab === tab)
    .map(chart)
    .join("");
  if (tab === "sources") {
    view +=
      '<section class="section"><p class="kicker">How the numbers were combined</p><h2 class="card-title">Weight the source, do not blend a fight</h2><p class="used">The three scores are formulas, not a secret average of every benchmark. Cost and speed use one house turn. Value divides the AA index by that cost, and only when both inputs are a single published number.</p>' +
      D.weights.map((row) => '<div class="src-block"><h3>' + row.tier + "</h3><p>" + row.use + "</p></div>").join("") +
      '<h2 class="card-title" style="margin-top:28px">Left off the bars</h2><ul class="steps">' +
      D.rejected.map((item) => "<li>" + item + "</li>").join("") +
      '</ul><p class="used">House turn: ' +
      D.house.why +
      "</p></section>";
  }
  return (
    '<header class="top"><div><p class="brand"><span>Advaita</span> · Model board</p><h1>Benchmark battle</h1><p class="meta">' +
    D.pulledLine +
    " · " +
    D.models.length +
    ' models · tap a row for sources</p></div><button type="button" class="ghost" id="theme">' +
    (dark ? "Light mode" : "Dark mode") +
    '</button></header><ul class="legend" aria-label="How to read a row"><li><span class="key key-new"></span>Newest</li><li><span class="key key-old"></span>Older version</li><li><span class="key key-fight"></span>Sources disagree</li><li><span class="key key-none"></span>? No score yet</li></ul><p class="draft">Marks are simple shapes, not company logos. Draft data. Ungraded.</p><p class="lede"><strong>Who should do the job.</strong> Staff ' +
    lineFor("aa", "no published boss") +
    " as the boss. Put " +
    lineFor("osworld", "no published desktop model") +
    " on the desktop. Put " +
    lineFor("deepswe", "no published repo model") +
    ' on repo work. Use Haiku when the turn has to be cheap.</p><nav class="tabs">' +
    TABS.map(
      ([id, label]) =>
        '<button type="button" class="tab" data-tab="' + id + '" aria-selected="' + (tab === id) + '">' + label + "</button>",
    ).join("") +
    "</nav>" +
    view +
    '<footer class="foot"><p>Pulled ' +
    D.pulled +
    ". Same board as the live preview. Open this page in Safari. Amber means the sources disagree.</p></footer>" +
    sheet()
  );
}

function draw() {
  const other = document.getElementById("other");
  const keep = other ? other.value : "";
  root.innerHTML = body();
  const next = document.getElementById("other");
  if (next && keep) next.value = keep;
}

root.addEventListener("click", (event) => {
  const theme = event.target.closest("#theme");
  if (theme) {
    dark = !dark;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    localStorage.setItem("mb-theme", dark ? "dark" : "light");
    draw();
    return;
  }
  const t = event.target.closest("[data-tab]");
  if (t) {
    tab = t.getAttribute("data-tab");
    open = null;
    draw();
    return;
  }
  const j = event.target.closest("[data-job]");
  if (j) {
    const id = j.getAttribute("data-job");
    job = job === id ? null : id;
    localStorage.setItem("decisions/call1", JSON.stringify({ question: "What are you staffing?", pick: job, savedAt: new Date().toISOString() }));
    draw();
    return;
  }
  const row = event.target.closest("[data-open]");
  if (row) {
    open = row.getAttribute("data-open").split(":");
    draw();
    return;
  }
  if (event.target.closest("[data-close]")) {
    open = null;
    draw();
  }
});
root.addEventListener("input", (event) => {
  if (event.target.id !== "other") return;
  const value = event.target.value.trim();
  job = value || null;
  localStorage.setItem("decisions/call1", JSON.stringify({ question: "What are you staffing?", pick: job, savedAt: new Date().toISOString() }));
  const rec = root.querySelector(".rec");
  if (value && !rec) {
    const p = document.createElement("p");
    p.className = "rec";
    p.textContent = "Saved. Use Cost, Speed, and Value, then the bench closest to that job.";
    event.target.parentElement.after(p);
  }
});

try {
  const theme = localStorage.getItem("mb-theme");
  dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  if (theme) document.documentElement.dataset.theme = theme;
  const raw = localStorage.getItem("decisions/call1");
  if (raw) job = JSON.parse(raw).pick || null;
} catch (e) {}
draw();
</script>
</body>
</html>
